name: CI/CD Pipeline - Ventrina SaaS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Verificación, Pruebas y Compilación
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.5

      - name: Configurar Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Instalar Dependencias
        run: pnpm install --frozen-lockfile

      - name: Verificación de Calidad y Estilo (Biome)
        run: pnpm run lint

      - name: Verificación de Tipos (Astro Check)
        run: pnpm run check

      - name: Verificación Pre-Vuelo
        run: pnpm run preflight

      - name: Ejecución de Suite de Pruebas Unitarias e Integración
        run: pnpm test

      - name: Compilación Estática para Producción
        run: pnpm run build

      - name: Guardar Artefacto de Compilación (dist)
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/
          retention-days: 7

  deploy:
    name: Despliegue en Cloudflare Pages
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout del Repositorio
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v4

      - name: Instalar pnpm
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.5

      - name: Configurar Node.js
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Instalar Dependencias
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm install --frozen-lockfile

      - name: Descargar Artefacto de Compilación
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/download-artifact@v4
        with:
          name: dist-artifacts
          path: dist/

      - name: Aplicar Migraciones en D1 Remoto
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm run db:migrate:remote

      - name: Desplegar a Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm dlx wrangler pages deploy dist --project-name=ventrina --commit-dirty=true

